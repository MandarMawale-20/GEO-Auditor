services:
  - type: web
    name: geo-auditor-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false  # secret — set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: REQUEST_TIMEOUT_SECONDS
        value: "8.0"
      - key: LLM_TIMEOUT_SECONDS
        value: "6.0"
      - key: MAX_HTML_BYTES
        value: "3000000"
      # CORS allowed origins are defined in app/main.py.
      # Allowed by default: https://geoauditor.pages.dev, http://localhost:*
      # To allow a different Pages/custom domain, set CORS_ORIGINS (comma-separated):
      # - key: CORS_ORIGINS
      #   value: https://your-site.pages.dev,https://geo.example.com